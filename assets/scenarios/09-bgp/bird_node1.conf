log stderr all;
router id 172.17.0.2;

protocol device {
}

# Injects BGP learned routes into the Linux kernel routing table
protocol kernel {
  ipv4 {
    export all;
  };
}

# Defines the local pod subnet managed by this node
protocol static local_pods {
  ipv4;
  route 10.1.1.0/24 via "br0";
}

# BGP peering with Node 2
protocol bgp node2 {
  local 172.17.0.2 as 65000;
  neighbor 172.17.0.3 as 65000;
  ipv4 {
    import all;  # Learn pod subnets from node2
    export all;  # Announce local_pods to node2
  };
}
