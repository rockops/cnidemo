log stderr all;
router id 172.17.0.3;

protocol device {
}

# Imports directly connected subnets so BIRD can resolve BGP next-hops (excluding pod bridge br0)
protocol direct {
  ipv4;
  interface -"br*", "*";
}

# Injects BGP learned routes into the Linux kernel routing table
protocol kernel {
  ipv4 {
    export where source = RTS_BGP;
  };
}

# Defines the local pod subnet managed by this node
protocol static local_pods {
  ipv4;
  route 10.1.2.0/24 via "br0";
}

# BGP peering with Node 1
protocol bgp node1 {
  local 172.17.0.3 as 65000;
  neighbor 172.17.0.2 as 65000;
  ipv4 {
    import all;  # Learn pod subnets from node1
    export where proto = "local_pods";  # Announce local_pods to node1
    next hop self;
  };
}

# BGP peering with Node 3
protocol bgp node3 {
  local 172.17.0.3 as 65000;
  neighbor 172.17.0.4 as 65000;
  ipv4 {
    import all;  # Learn pod subnets from node3
    export where proto = "local_pods";  # Announce local_pods to node3
    next hop self;
  };
}

